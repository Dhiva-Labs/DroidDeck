name: CI

# Builds, tests and packages the Linux desktop app for x64 and arm64, each on a
# native runner: Flutter cannot cross-compile the desktop target, so every
# architecture is built on a machine of that architecture. The snap jobs build
# the amd64 and arm64 snaps the same way.
#
# From the same build come an .rpm (Fedora, RHEL, openSUSE), an Arch
# package, an AUR PKGBUILD, an AppImage and a Flatpak bundle, each installed
# and run on its distribution.
#
# Every run keeps the packages as workflow artifacts. When a GitHub release is
# published, the release job attaches every package of each architecture
# except the snap, skipping any asset the release already has (so a
# hand-uploaded package is never replaced, and a release published with notes
# only is completed).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Flutter release DroidDeck is developed with. There are no Flutter SDK
  # archives for linux-arm64, so every leg installs the SDK the same way: a
  # shallow clone of the release tag.
  FLUTTER_VERSION: '3.44.6'

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    env:
      BUNDLE: build/linux/${{ matrix.arch }}/release/bundle
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # xvfb, xauth, xdotool, dbus-x11: the smoke run of the installed .deb.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            file xvfb xauth xdotool dbus-x11

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build linux --release

      # libflutter_pty.so is flutter_pty's native C code, compiled by the
      # build and opened with dlopen at run time, so it is checked too.
      - name: Assert every ELF file in the bundle is ${{ matrix.elf_machine }}
        run: |
          for f in droid_deck lib/libapp.so lib/libflutter_linux_gtk.so lib/libflutter_pty.so; do
            [ -f "$BUNDLE/$f" ] || { echo "::error::missing $BUNDLE/$f"; exit 1; }
          done
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            echo "$f: $desc"
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE"; bad=1 ;;
            esac
          done < <(find "$BUNDLE" -type f -print0)
          echo "checked $checked ELF files"
          [ "$checked" -ge 4 ] && [ "$bad" -eq 0 ]

      - name: Package .deb
        run: packaging/build_deb.sh dist

      - name: Check the package
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          DEB="dist/droiddeck_${VERSION}_${{ matrix.deb_arch }}.deb"
          ls -l dist
          [ "$(ls dist | wc -l)" -eq 1 ]
          dpkg-deb --info "$DEB"
          [ "$(dpkg-deb --field "$DEB" Architecture)" = "${{ matrix.deb_arch }}" ]
          sudo apt-get install -y "./$DEB"
          file /usr/lib/droiddeck/droid_deck | grep "$ELF_MACHINE"
          file /usr/lib/droiddeck/lib/libflutter_pty.so | grep "$ELF_MACHINE"

      # The GTK runner shows the window only once Flutter has rendered its
      # first frame, so a visible "DroidDeck" window proves the AOT snapshot
      # runs on this architecture. No adb is installed here: the app starts
      # and reports it cannot find one.
      - name: Smoke-run the installed app (Xvfb)
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/smoke.log"
          droiddeck > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if xdotool search --onlyvisible --name '^DroidDeck$' > /dev/null 2>&1; then
              echo "DroidDeck window is up after ${i}s"
              sleep 5
              kill -0 "$pid" || { echo "droiddeck died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "droiddeck exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no DroidDeck window after 90s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # Repackages each architecture's .deb for Fedora/RHEL/openSUSE (.rpm),
  # Arch (.pkg.tar.zst) and any glibc distribution (AppImage), so every format
  # ships the binary tested above. Each one is then installed on the real
  # distribution and run there (packaging/linux-distros/verify.sh): the
  # package manager must resolve its libraries and adb, ldd must find every
  # library, and smoke.sh must see a painted UI whose device tracker is
  # connected to the adb server the app started.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: deb

      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64; ai_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; ai_arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-$ai_arch.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build .rpm, Arch package and AppImage
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          dpkg-deb -x "deb/droiddeck_${VERSION}_${{ matrix.deb_arch }}.deb" "$RUNNER_TEMP/root"
          VERSION="$VERSION" packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb_arch }} dist
          # The Flatpak job builds from the same tree; tar keeps modes and symlinks.
          tar -C "$RUNNER_TEMP/root" -cJf "$RUNNER_TEMP/tree.tar.xz" .

      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree.tar.xz
          if-no-files-found: error
          retention-days: 3

      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

  # AUR recipe: PKGBUILD + .SRCINFO for droiddeck-bin, rendered with the
  # checksums of the .debs built above and proven with makepkg and an
  # install on archlinux:latest. Pushing it to the AUR is a manual step.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: debs
          merge-multiple: true

      - name: Render and check the PKGBUILD
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          VERSION="$VERSION" packaging/arch/aur.sh \
            "debs/droiddeck_${VERSION}_amd64.deb" "debs/droiddeck_${VERSION}_arm64.deb" dist

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # The Flatpak, built from the same installed tree in the Flathub builder
  # image. It carries no adb: its adb and scrcpy run the host's through
  # flatpak-spawn, so it is tested in the next job on a plain Ubuntu runner
  # that has adb, the way a user installs it.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [distros]
    # It only needs the tree, which distros uploads before its distribution
    # checks, so a Flatpak problem shows in the same run as a failed check.
    if: ${{ !cancelled() && needs.distros.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, fp_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, fp_arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Unpack the installed tree
        id: v
        run: |
          mkdir -p packaging/flatpak/tree
          tar -xJf "$RUNNER_TEMP/tree.tar.xz" -C packaging/flatpak/tree
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          echo "bundle=droiddeck-$VERSION-${{ matrix.fp_arch }}.flatpak" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.dhivalabs.droid_deck.yml
          bundle: ${{ steps.v.outputs.bundle }}
          arch: ${{ matrix.fp_arch }}
          cache: false
          artifact-name: flatpak-${{ matrix.arch }}

  # Installs the bundle the way a user would (runtime from Flathub) on an
  # Ubuntu runner with the distribution's adb, and checks it inside the
  # sandbox: every library resolves, adb and scrcpy are the host shims, and
  # the sandboxed app paints its UI, finds adb and connects its device
  # tracker to the host's adb server (smoke.sh).
  flatpak-run:
    name: Flatpak on Ubuntu ${{ matrix.arch }}
    needs: [flatpak]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, fp_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, fp_arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      APP_ID: com.dhivalabs.droid_deck
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flatpak-${{ matrix.arch }}
          path: bundle

      # adb: what the sandboxed app runs on the host.
      # xvfb, xauth, dbus-x11: the smoke run.
      - name: Install Flatpak, adb and a display
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak adb xvfb xauth dbus-x11
          adb version

      - name: Install the bundle with its runtime from Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          flatpak install --user -y --noninteractive "bundle/droiddeck-$VERSION-${{ matrix.fp_arch }}.flatpak"
          flatpak info --user --show-permissions "$APP_ID"

      - name: Check the bundle inside the sandbox
        run: |
          flatpak run --command=sh "$APP_ID" -s < packaging/flatpak/ldd-check.sh
          # ToolLocator asks `which` first, which must find the shims.
          flatpak run --command=sh "$APP_ID" -c '
            set -eu
            for c in adb scrcpy; do
              [ "$(which "$c")" = "/app/bin/$c" ]
              [ "$(readlink -f "/app/bin/$c")" = /app/libexec/droiddeck/host-tool ]
            done
          '

      - name: Run the sandboxed app (Xvfb)
        timeout-minutes: 5
        run: |
          export SMOKE_FB="$RUNNER_TEMP/fb"
          mkdir -p "$SMOKE_FB"
          # The runner has no login session, so no XDG_RUNTIME_DIR.
          if [ -z "${XDG_RUNTIME_DIR:-}" ]; then
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
            mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          fi
          # flatpak-spawn --host reaches the host through
          # flatpak-session-helper on this session bus.
          xvfb-run -a -s "-screen 0 1280x800x24 -fbdir $SMOKE_FB" \
            dbus-run-session -- bash packaging/linux-distros/smoke.sh flatpak run "$APP_ID"
          echo "--- the adb server the sandboxed app started, on the host:"
          adb devices -l

  snap:
    name: Snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: snapcore/action-build@v1
        id: build

      - name: Assert the snap is ${{ matrix.arch }}
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          ls -l "$SNAP_FILE"
          case "$SNAP_FILE" in
            *_${{ matrix.arch }}.snap) ;;
            *) echo "::error::unexpected snap file name $SNAP_FILE"; exit 1 ;;
          esac
          command -v unsquashfs > /dev/null || sudo apt-get install -y squashfs-tools
          unsquashfs -q -d "$RUNNER_TEMP/snap" "$SNAP_FILE"
          sed -n '/^architectures:/,/^[a-z]/p' "$RUNNER_TEMP/snap/meta/snap.yaml"
          grep -qx -- '- ${{ matrix.arch }}' "$RUNNER_TEMP/snap/meta/snap.yaml"
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE: $desc"; bad=1 ;;
            esac
          done < <(find "$RUNNER_TEMP/snap" -type f -print0)
          echo "checked $checked ELF files in the snap"
          for f in droid_deck lib/libflutter_pty.so usr/lib/android-sdk/platform-tools/adb; do
            file "$RUNNER_TEMP/snap/$f" | tee /dev/stderr | grep -q "$ELF_MACHINE"
          done
          [ "$bad" -eq 0 ]

      # Installs the snap built above (with its gnome content snap) and runs
      # it confined: the bundled adb, then the app itself under Xvfb. The
      # wrapper that finds adb's libraries and the Flutter runner both have to
      # work for this to pass, so it covers the architecture triplet in the
      # snap's launcher environment as well.
      - name: Install the snap and run it
        timeout-minutes: 15
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo apt-get install -y xvfb xauth xdotool
          sudo snap install --dangerous "$SNAP_FILE"
          snap list
          adb-deck.adb version | tee "$RUNNER_TEMP/adb-version.txt"
          grep -q '^Installed as /snap/adb-deck/' "$RUNNER_TEMP/adb-version.txt"
          cat > "$RUNNER_TEMP/snap-smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/snap-smoke.log"
          adb-deck > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            if xdotool search --onlyvisible --name '^DroidDeck$' > /dev/null 2>&1; then
              echo "DroidDeck window is up after ${i}s"
              sleep 5
              kill -0 "$pid" || { echo "adb-deck died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "adb-deck exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no DroidDeck window after 120s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24 -ac" bash "$RUNNER_TEMP/snap-smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  release:
    name: Release assets
    needs: [linux, distros, aur, flatpak-run]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'distros-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: assets

      - uses: actions/download-artifact@v8
        with:
          pattern: 'flatpak-*'
          path: assets
          merge-multiple: true

      - name: Select the release assets
        id: select
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          FILES="assets/droiddeck-bin-${VERSION}-aur.tar.gz"
          for arch in amd64:x86_64 arm64:aarch64; do
            deb_arch="${arch%%:*}"
            uname_arch="${arch##*:}"
            FILES="$FILES assets/droiddeck_${VERSION}_${deb_arch}.deb"
            FILES="$FILES assets/droiddeck-${VERSION}-1.${uname_arch}.rpm"
            FILES="$FILES assets/droiddeck-${VERSION}-1-${uname_arch}.pkg.tar.zst"
            FILES="$FILES assets/DroidDeck-${VERSION}-${uname_arch}.AppImage"
            FILES="$FILES assets/droiddeck-${VERSION}-${uname_arch}.flatpak"
          done
          ls -l assets
          [ "$(ls assets | wc -l)" -eq 11 ]
          ls -l $FILES
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Upload to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.select.outputs.version }}
          FILES: ${{ steps.select.outputs.files }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          # Attach what the release lacks. An asset that is already there
          # (built and uploaded by hand) is left exactly as it is.
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in $FILES; do
            if grep -qxF -- "$(basename "$f")" <<< "$existing"; then
              echo "$(basename "$f") is already on release $TAG, skipping"
            else
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
