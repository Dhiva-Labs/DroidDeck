# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (packaging/build_deb.sh).

NAME=droiddeck
APP_NAME=DroidDeck
GITHUB_REPO=Dhiva-Labs/DroidDeck
TAG_PREFIX=v
SUMMARY='ADB command center for Android development'
DESCRIPTION='DroidDeck is a Linux desktop GUI around adb and scrcpy: a live device dashboard with socket-based tracking, a logcat viewer with ring-buffered priority/tag/text/package filtering, an app manager (install, launch, force-stop, uninstall, base+split APK extract), a device file explorer with drag-and-drop push/pull, screenshot/recording/scrcpy screen tools, wireless adb pairing with saved devices, and a real interactive shell with a quick-actions grid.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/DroidDeck
LICENSE=MIT
LICENSE_FILE=LICENSE

# Everything DroidDeck does goes through adb. The .deb only recommends it,
# so that an adb from the Android SDK is enough; these packages require the
# distribution's (android-tools on Fedora, openSUSE and Arch), so a fresh
# install works. scrcpy (screen mirroring) stays optional, as in the .deb.
#
# Flutter's engine opens libEGL.so.1 and libGLESv2.so.2 with dlopen, so the
# ELF scan cannot see them: they are listed here as rpm soname dependencies
# (libglvnd on Fedora, Mesa's libEGL1/libGLESv2-2 on openSUSE), and Arch gets
# libglvnd.
RPM_REQUIRES=(/usr/bin/adb 'libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
RPM_RECOMMENDS=(scrcpy)
ARCH_DEPENDS=(gtk3 android-tools libglvnd)
ARCH_OPTDEPENDS=('scrcpy: screen mirroring and recording')
ARCH_INDEPENDENT=0

# AppImage: it runs the host's adb, like the .deb.
APPIMAGE=1
EXEC=usr/lib/droiddeck/droid_deck
DESKTOP=usr/share/applications/com.dhivalabs.droid_deck.desktop
ICON=usr/share/icons/hicolor/256x256/apps/droiddeck.png
APPRUN_ENV=''

# Smoke test run in each distribution container by verify.sh: smoke.sh
# starts GUI_CMD and passes once the Flutter UI has painted, the app has
# found adb and its device tracker is connected to the adb server it started
# (see smoke.sh).
GUI_CMD=droiddeck
SMOKE_SECONDS=120
SMOKE_CMD=''
